name: Deploy

# Releases and deploys what main says should be out. A version on main with no
# tag is a pending release: once CI and Cloudflare's preview build of main have
# passed, this tags it and moves the app's deploy/<app> branch, which Cloudflare
# Builds deploys to production. Nothing is tagged that has not already built.
# See docs/VERSIONING.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: read

concurrency:
  group: media-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git fetch --force --tags origin '+refs/heads/deploy/*:refs/remotes/origin/deploy/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/promote-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
